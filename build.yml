          find TOSIsland -type f | sort

      - name: Mark version 2.1
        run: |
          sed -i 's/android:label="TOS Island"/android:label="TOS Island 2.1"/' TOSIsland/app/src/main/AndroidManifest.xml
          sed -i 's/versionCode = 1; versionName = "1.0"/versionCode = 2; versionName = "2.1"/' TOSIsland/app/build.gradle.kts
          grep -n 'label=' TOSIsland/app/src/main/AndroidManifest.xml
          grep -n 'versionName' TOSIsland/app/build.gradle.kts
          grep -c 'Backdrop' TOSIsland/app/src/main/java/com/tos/island/MainActivity.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: TOSIsland
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          grep -E "^e: |What went wrong|error:" -A2 build.log | head -10 | while IFS= read -r l; do echo "::error::$l"; done
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: TOSIsland-debug
          path: TOSIsland/app/build/outputs/apk/debug/*.apk

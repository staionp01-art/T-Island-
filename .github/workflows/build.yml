name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q TOSIsland-Android.zip

      - name: Fix code
        run: |
          sed -i 's/fun setCover(b: Bitmap?)/fun updateCover(b: Bitmap?)/' TOSIsland/app/src/main/java/com/tos/island/Hub.kt
          sed -i 's/Hub\.setCover(/Hub.updateCover(/' TOSIsland/app/src/main/java/com/tos/island/NotifService.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: TOSIsland
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          grep -E "^e: |What went wrong|error:" -A2 build.log | head -10 | while IFS= read -r l; do echo "::error::$l"; done
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: TOSIsland-debug
          path: TOSIsland/app/build/outputs/apk/debug/*.apk

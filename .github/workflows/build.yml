                  toggle(opt, "رسالة تشخيص عند اللمس", "تظهر عبارة «لمسة ✓» عند لمس الجزيرة للتأكد أن اللمس يصل", { Prefs.diag }, { Prefs.diag = it })
                  toggle(opt, "حركة الألوان أثناء السكون", "ألوان متحركة على الكبسولة حين لا تعمل موسيقى", { Prefs.idleAnim }, { Prefs.idleAnim = it })
                  toggle(opt, "التشغيل التلقائي", "تعمل الجزيرة بعد إعادة تشغيل الهاتف وبعد التحديث", { Prefs.auto }, { Prefs.auto = it })
                  accents(opt)
                  val reset = button("استعادة الإعدادات الافتراضية", false) {
                      Prefs.reset()
                      for (f in refreshers) f()
                      Hub.onLayout?.invoke()
                      Hub.onChange?.invoke()
                  }
                  opt.addView(reset, LinearLayout.LayoutParams(-1, dp(46)).apply { topMargin = dp(20) })
                  col.addView(opt, top(14))

                  setContentView(frame)
                  refresh()
              }

              override fun onResume() { super.onResume(); refresh() }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  refresh()
              }

              private fun refresh() {
                  var done = 0
                  for (r in rows) {
                      val ok = r.ok()
                      if (ok) done++
                      r.badge.text = if (ok) "✓" else r.num
                      r.badge.setTextColor(if (ok) dark else ink)
                      r.badge.background = oval(if (ok) okc else 0x26FFFFFF)
                      r.act.visibility = if (ok) View.GONE else View.VISIBLE
                  }
                  permTitle.text = "الخطوة 1  ·  الأذونات ($done/${rows.size})"
                  val run = Hub.running
                  svcDot.background = oval(if (run) okc else mute)
                  svc.text = if (run) "الجزيرة تعمل" else "الجزيرة متوقفة"
                  startBtn.text = if (run) "إيقاف الجزيرة" else "تشغيل الجزيرة"
                  styleBtn(startBtn, !run)
                  val e = Hub.lastError
                  if (e != null) msg("تعذّر التشغيل: " + e, true)
              }
          }
          TOSEOF
          mkdir -p "$(dirname 'TOSIsland/app/src/main/java/com/tos/island/MusicView.kt')"
          cat > 'TOSIsland/app/src/main/java/com/tos/island/MusicView.kt' <<'TOSEOF'
          package com.tos.island

          import android.content.Context
          import android.graphics.*
          import android.os.SystemClock
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.*

          /** مشغّل الموسيقى: غلاف كخلفية + موجة تفاعلية على شريط التقدم (نفس تصميم الفيديو). */
          class MusicView(c: Context) : View(c) {
              var expanded = false
              var idle = false
              var onPress: (() -> Unit)? = null
              var onRelease: (() -> Unit)? = null
              private var pulse = 0L
              var onCollapse: (() -> Unit)? = null
              var onExpand: (() -> Unit)? = null
              private val d = resources.displayMetrics.density
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val add = Paint(Paint.ANTI_ALIAS_FLAG).apply { xfermode = PorterDuffXfermode(PorterDuff.Mode.ADD) }
              private val path = Path()
              private val B = FloatArray(8)
              private val btn = Array(5) { RectF() }
              private var drag = -1f
              private var liked = false
              private val offs = floatArrayOf(0f, 1.7f, 3.1f)

              private fun ci(a: Float, b: Float, f: Float) = a + (b - a) * (1 - cos(f * PI.toFloat())) / 2f
              /** قوة وميض اللمس: 1 عند الضغط وتتلاشى خلال أقل من ثانية. */
              private fun pulseK(): Float {
                  if (pulse == 0L) return 0f
                  return (1f - (SystemClock.uptimeMillis() - pulse) / 700f).coerceIn(0f, 1f)
              }

              private val palette = intArrayOf(0xFF7FD6E4.toInt(), 0xFF8C86FF.toInt(), 0xFFFF7EB6.toInt(), 0xFF3DDC97.toInt())

              /** الكبسولة الساكنة: توهج على جانب + أعمدة ملوّنة على الجانب الآخر، والمنتصف فارغ للكاميرا. */
              private fun idleDraw(cv: Canvas, w: Float, h: Float, acc: Int) {
                  val t = SystemClock.uptimeMillis().toFloat()
                  val k = pulseK()
                  val gap = Prefs.gap * d
                  val zone = max(14 * d, (w - gap) / 2f)
                  val lc = zone / 2f; val rc = w - zone / 2f; val cy = h / 2
                  val moving = Prefs.idleAnim || k > 0f
                  val tt = if (moving) t else 0f
                  // توهج نابض على اليسار
                  val sn = 0.5f + 0.5f * sin(tt / 500f)
                  p.style = Paint.Style.FILL; p.color = acc; p.alpha = (50 + 110 * sn + 90 * k).toInt().coerceIn(0, 255)
                  cv.drawCircle(lc, cy, (5 + 3 * sn + 4 * k) * d, p)
                  p.alpha = 255; cv.drawCircle(lc, cy, 2.6f * d, p)
                  // أعمدة ملوّنة تتحرك على اليمين
                  for (i in 0..3) {
                      val v = 0.15f + 0.4f * abs(sin(tt / 650f + i * 1.3f)) + 0.35f * k
                      val bar = 3 * d + max(2f, h - 18 * d) * v
                      val bx = rc + (i - 1.5f) * 6 * d
                      p.color = palette[i]; p.alpha = 255
                      cv.drawRoundRect(bx - 1.5f * d, cy - bar / 2, bx + 1.5f * d, cy + bar / 2, 2 * d, 2 * d, p)
                  }
              }

              private fun fit(s: String, maxW: Float): String {
                  if (p.measureText(s) <= maxW) return s
                  var n = s.length
                  while (n > 1 && p.measureText(s.substring(0, n) + "…") > maxW) n--
                  return s.substring(0, n) + "…"
              }
              private fun fmt(ms: Long): String { val s = ms / 1000; return "%d:%02d".format(s / 60, s % 60) }

              override fun onDraw(cv: Canvas) {
                  val w = width.toFloat(); val h = height.toFloat(); val t = SystemClock.uptimeMillis().toFloat()
                  val real = Hub.live && Hub.bands.sum() > 0.03f
                  for (k in 0..7) {
                      val v = if (real) Hub.bands[k] else if (Hub.playing) 0.2f + 0.6f * abs(sin(t / 430f + k * 1.7f)) else if (expanded && Hub.title.isEmpty()) 0.15f + 0.4f * abs(sin(t / 600f + k * 1.7f)) else 0.05f
                      B[k] += (v - B[k]) * 0.35f
                  }
                  val acc = Hub.accentColor
                  cv.drawColor(Color.BLACK)
                  if (!expanded) {
                      if (idle) { idleDraw(cv, w, h, acc); if (Prefs.idleAnim || pulseK() > 0f) postInvalidateOnAnimation() }
                      else { pill(cv, w, h, acc); if (Hub.playing || pulseK() > 0f) postInvalidateOnAnimation() }
                      return
                  }

                  val bass = (B[0] + B[1]) / 2
                  val cover = Hub.cover
                  if (cover != null) {
                      val s = max(w / cover.width, h / cover.height) * (1.05f + bass * 0.09f)
                      cv.save(); cv.translate(w / 2, h / 2); cv.scale(s, s)
                      cv.drawBitmap(cover, -cover.width / 2f, -cover.height / 2f, null); cv.restore()
                  } else {
                      p.shader = LinearGradient(0f, 0f, w, h, acc, 0xFF0D1024.toInt(), Shader.TileMode.CLAMP)
                      cv.drawRect(0f, 0f, w, h, p); p.shader = null
                  }
                  p.shader = LinearGradient(0f, 0f, 0f, h, 0x59000000, 0xB8000000.toInt(), Shader.TileMode.CLAMP)
                  cv.drawRect(0f, 0f, w, h, p); p.shader = null

                  val band = (Prefs.idleH + 4) * d
                  val pad = 18 * d
                  // الترويسة: يبقى منتصفها فارغًا لأن الكاميرا هناك
                  p.style = Paint.Style.FILL; p.color = Color.WHITE; p.alpha = 200; p.textSize = 11 * d; p.isFakeBoldText = false
                  p.textAlign = Paint.Align.LEFT; cv.drawText("هذا الهاتف", pad, band / 2 + 4 * d, p)
                  val xc = w - pad - 8 * d
                  btn[4].set(xc - 22 * d, band / 2 - 20 * d, xc + 22 * d, band / 2 + 20 * d)
                  icon(cv, 4, xc, band / 2, acc)

                  // العنوان والفنان تحت منطقة الكاميرا
                  p.style = Paint.Style.FILL; p.color = Color.WHITE; p.alpha = 255; p.textSize = 15 * d; p.isFakeBoldText = true
                  val ttl = if (Hub.title.isEmpty()) "لا توجد موسيقى الآن" else Hub.title
                  val tw = p.measureText(ttl); val aw = w - 2 * pad
                  cv.save(); cv.clipRect(pad, band + 2 * d, w - pad, band + 26 * d)
                  if (tw <= aw) { p.textAlign = Paint.Align.CENTER; cv.drawText(ttl, w / 2, band + 20 * d, p) }
                  else { val gp = 40 * d; val off = (t / 25f) % (tw + gp); p.textAlign = Paint.Align.LEFT
                      cv.drawText(ttl, pad - off, band + 20 * d, p); cv.drawText(ttl, pad - off + tw + gp, band + 20 * d, p) }
                  cv.restore(); p.isFakeBoldText = false
                  val sub = if (Hub.title.isEmpty()) "شغّل أي أغنية وستظهر هنا" else Hub.artist
                  if (sub.isNotEmpty()) {
                      p.alpha = 190; p.textSize = 12 * d; p.textAlign = Paint.Align.CENTER
                      cv.drawText(fit(sub, aw), w / 2, band + 40 * d, p)
                  }

                  // ---- شريط التقدم + الموجة ----
                  val m = band + 76 * d; val x0 = pad; val x1 = w - pad
                  val pos = if (drag >= 0) (drag * Hub.dur).toLong() else Hub.pos + (if (Hub.playing) SystemClock.elapsedRealtime() - Hub.stamp else 0L)
                  val fr = if (Hub.dur > 0) (pos.toFloat() / Hub.dur).coerceIn(0f, 1f) else if (Hub.title.isEmpty()) 1f else 0f
                  val px = x0 + (x1 - x0) * fr
                  p.style = Paint.Style.STROKE; p.strokeCap = Paint.Cap.ROUND; p.strokeWidth = 5 * d
                  p.color = Color.WHITE; p.alpha = 82; cv.drawLine(px, m, x1, m, p)
                  val len = px - x0
                  if (len > 8 * d) {
                      val cols = intArrayOf(acc, Color.WHITE, acc); val als = floatArrayOf(.55f, .3f, .5f); val ks = floatArrayOf(1f, .8f, .62f)
                      for (q in 0..2) {
                          val xs = ArrayList<Float>(); val ys = ArrayList<Float>()
                          var xx = 0f
                          while (xx <= len) {
                              val env = sin(PI.toFloat() * min(xx / len, 1f)).pow(.7f)
                              val pos2 = xx / (55 * d) + t / (800f + q * 350f) + offs[q]
                              val i0 = floor(pos2).toInt(); val f = pos2 - i0
                              val v = ci(B[((i0 % 8) + 8) % 8], B[(((i0 + 1) % 8) + 8) % 8], f)
                              val amp = if (Hub.playing || Hub.title.isEmpty()) env * ks[q] * (1 + 14 * v * (.45f + .55f * abs(sin(xx / d * .075f + t / 330f + q * 2.1f)))) else 0f
                              xs.add(x0 + xx); ys.add(m - 2 * d - amp * d); xx += 6 * d
                          }
                          path.reset(); path.moveTo(x0, m); path.lineTo(xs[0], ys[0])
                          for (a in 0 until xs.size - 1) path.quadTo(xs[a], ys[a], (xs[a] + xs[a + 1]) / 2, (ys[a] + ys[a + 1]) / 2)
                          path.lineTo(px, m); path.close()
                          add.style = Paint.Style.FILL; add.color = cols[q]; add.alpha = (als[q] * 255).toInt(); cv.drawPath(path, add)
                          if (q == 1) { p.style = Paint.Style.STROKE; p.strokeWidth = 1.2f * d; p.color = Color.WHITE; p.alpha = 230; cv.drawPath(path, p) }
                      }
                  }
                  p.style = Paint.Style.STROKE; p.strokeWidth = 11 * d; p.color = acc; p.alpha = 64; cv.drawLine(x0, m, px, m, p)
                  p.strokeWidth = 5 * d; p.alpha = 255; cv.drawLine(x0, m, px, m, p)
                  p.style = Paint.Style.FILL; p.color = acc; p.alpha = 80; cv.drawCircle(px, m, 14 * d, p)
                  p.color = Color.WHITE; p.alpha = 255; cv.drawCircle(px, m, 9 * d, p)
                  p.color = acc; cv.drawCircle(px, m, 6 * d, p)

                  p.color = Color.WHITE; p.alpha = 170; p.textSize = 11 * d
                  p.textAlign = Paint.Align.LEFT; cv.drawText(fmt(pos), x0, m + 26 * d, p)
                  p.textAlign = Paint.Align.RIGHT; cv.drawText(fmt(Hub.dur), x1, m + 26 * d, p)

                  // ---- أزرار التحكم ----
                  val cy = m + 64 * d
                  for (i in 0..3) {
                      val cx = x0 + 26 * d + i * (w - 2 * pad - 52 * d) / 3
                      btn[i].set(cx - 26 * d, cy - 26 * d, cx + 26 * d, cy + 26 * d)
                      if (i in 1..3) { p.style = Paint.Style.FILL; p.color = Color.WHITE; p.alpha = 36; cv.drawCircle(cx, cy, (if (i == 2) 24 else 21) * d, p) }
                      icon(cv, i, cx, cy, acc)
                  }
                  if (Hub.playing || Hub.title.isEmpty() || drag >= 0) postInvalidateOnAnimation()
              }

              private fun tri(cv: Canvas, ax: Float, ay: Float, bx: Float, by: Float, cx: Float, cy: Float) {
                  path.reset(); path.moveTo(ax, ay); path.lineTo(bx, by); path.lineTo(cx, cy); path.close(); cv.drawPath(path, p)
              }

              private fun icon(cv: Canvas, k: Int, x: Float, y: Float, acc: Int) {
                  p.style = Paint.Style.FILL; p.color = Color.WHITE; p.alpha = 255
                  when (k) {
                      0 -> { p.textAlign = Paint.Align.CENTER; p.textSize = 22 * d; if (liked) p.color = acc; cv.drawText(if (liked) "♥" else "♡", x, y + 8 * d, p) }
                      1 -> { cv.drawRect(x - 9 * d, y - 7 * d, x - 7 * d, y + 7 * d, p); tri(cv, x + 8 * d, y - 7 * d, x - 5 * d, y, x + 8 * d, y + 7 * d) }
                      2 -> if (Hub.playing) { cv.drawRect(x - 6 * d, y - 8 * d, x - 2 * d, y + 8 * d, p); cv.drawRect(x + 2 * d, y - 8 * d, x + 6 * d, y + 8 * d, p) }
                           else tri(cv, x - 5 * d, y - 8 * d, x + 8 * d, y, x - 5 * d, y + 8 * d)
                      3 -> { cv.drawRect(x + 7 * d, y - 7 * d, x + 9 * d, y + 7 * d, p); tri(cv, x - 8 * d, y - 7 * d, x + 5 * d, y, x - 8 * d, y + 7 * d) }
                      4 -> { p.style = Paint.Style.STROKE; p.strokeWidth = 2 * d; p.strokeCap = Paint.Cap.ROUND
                          cv.drawLine(x - 6 * d, y - 6 * d, x + 6 * d, y + 6 * d, p); cv.drawLine(x + 6 * d, y - 6 * d, x - 6 * d, y + 6 * d, p) }
                  }
              }

              /** كبسولة نشطة: الغلاف على جانب والأعمدة على الجانب الآخر، والمنتصف فارغ للكاميرا. */
              private fun pill(cv: Canvas, w: Float, h: Float, acc: Int) {
                  val gap = Prefs.gap * d
                  val zone = max(20 * d, (w - gap) / 2f)
                  val lc = zone / 2f; val rc = w - zone / 2f; val cy = h / 2
                  val note = Hub.note
                  if (note != null) {
                      p.style = Paint.Style.FILL; p.color = acc; p.alpha = 80; cv.drawCircle(lc, cy, 9 * d, p)
                      p.alpha = 255; cv.drawCircle(lc, cy, 4.5f * d, p)
                      p.color = Color.WHITE; p.alpha = 235; p.isFakeBoldText = true; p.textSize = 12 * d; p.textAlign = Paint.Align.CENTER
                      val room = max(1f, zone - 14 * d); val tw0 = p.measureText(note)
                      if (tw0 > room) p.textSize = max(1f, 12 * d * room / tw0)
                      cv.drawText(note, rc, cy + p.textSize * 0.35f, p)
                      p.isFakeBoldText = false
                      return
                  }
                  val r = max(4 * d, h / 2 - 5 * d)
                  val b = Hub.cover
                  if (b != null) {
                      val sq = min(b.width, b.height)
                      cv.save(); path.reset(); path.addCircle(lc, cy, r, Path.Direction.CW); cv.clipPath(path)
                      cv.drawBitmap(b, Rect((b.width - sq) / 2, (b.height - sq) / 2, (b.width + sq) / 2, (b.height + sq) / 2), RectF(lc - r, cy - r, lc + r, cy + r), null)
                      cv.restore()
                  } else { p.style = Paint.Style.FILL; p.color = acc; p.alpha = 255; cv.drawCircle(lc, cy, r, p) }
                  p.style = Paint.Style.FILL; p.color = acc; p.alpha = 255
                  for (k in 0..3) {
                      val bh = 4 * d + max(2f, h - 16 * d) * B[k * 2]; val bx = rc + (k - 1.5f) * 6 * d
                      cv.drawRoundRect(bx - 1.5f * d, cy - bh / 2, bx + 1.5f * d, cy + bh / 2, 2 * d, 2 * d, p)
                  }
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  if (!expanded) {
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              pulse = SystemClock.uptimeMillis(); onPress?.invoke(); invalidate()
                              if (Prefs.diag) android.widget.Toast.makeText(context, "TOS Island 3.2 · لمسة ✓", android.widget.Toast.LENGTH_SHORT).show()
                          }
                          MotionEvent.ACTION_UP -> { onRelease?.invoke(); onExpand?.invoke() }
                          MotionEvent.ACTION_CANCEL -> onRelease?.invoke()
                      }
                      return true
                  }
                  val x0 = 18 * d; val x1 = width - 18 * d
                  when (e.action) {
                      MotionEvent.ACTION_DOWN -> if (abs(e.y - ((Prefs.idleH + 4) * d + 76 * d)) < 22 * d && Hub.dur > 0) {
                          drag = ((e.x - x0) / (x1 - x0)).coerceIn(0f, 1f); parent.requestDisallowInterceptTouchEvent(true) }
                      MotionEvent.ACTION_MOVE -> if (drag >= 0) drag = ((e.x - x0) / (x1 - x0)).coerceIn(0f, 1f)
                      MotionEvent.ACTION_UP -> {
                          if (drag >= 0) { Hub.controller?.transportControls?.seekTo((drag * Hub.dur).toLong()); Hub.pos = (drag * Hub.dur).toLong(); Hub.stamp = SystemClock.elapsedRealtime(); drag = -1f }
                          else { val i = btn.indexOfFirst { it.contains(e.x, e.y) }; val tc = Hub.controller?.transportControls
                              when (i) { 0 -> liked = !liked; 1 -> tc?.skipToPrevious(); 2 -> if (Hub.playing) tc?.pause() else tc?.play(); 3 -> tc?.skipToNext(); 4 -> onCollapse?.invoke() } }
                      }
                  }
                  invalidate(); return true
              }
          }
          TOSEOF
          mkdir -p "$(dirname 'TOSIsland/app/src/main/java/com/tos/island/NotifService.kt')"
          cat > 'TOSIsland/app/src/main/java/com/tos/island/NotifService.kt' <<'TOSEOF'
          package com.tos.island

          import android.app.Notification
          import android.content.ComponentName
          import android.media.MediaMetadata
          import android.media.session.MediaController
          import android.media.session.MediaSessionManager
          import android.media.session.PlaybackState
          import android.os.SystemClock
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification

          class NotifService : NotificationListenerService() {
              private val cb = object : MediaController.Callback() {
                  override fun onMetadataChanged(m: MediaMetadata?) = refresh()
                  override fun onPlaybackStateChanged(s: PlaybackState?) = refresh()
              }

              override fun onListenerConnected() {
                  val msm = getSystemService(MediaSessionManager::class.java)
                  val cn = ComponentName(this, NotifService::class.java)
                  msm.addOnActiveSessionsChangedListener({ pick(it) }, cn)
                  pick(msm.getActiveSessions(cn))
              }

              private fun pick(l: List<MediaController>?) {
                  val c = l?.firstOrNull { it.playbackState?.state == PlaybackState.STATE_PLAYING } ?: l?.firstOrNull()
                  Hub.controller?.unregisterCallback(cb)
                  Hub.controller = c
                  c?.registerCallback(cb)
                  refresh()
              }

              private fun refresh() {
                  val c = Hub.controller; val m = c?.metadata; val st = c?.playbackState
                  Hub.title = m?.getString(MediaMetadata.METADATA_KEY_TITLE) ?: ""
                  Hub.artist = m?.getString(MediaMetadata.METADATA_KEY_ARTIST) ?: ""
                  Hub.updateCover(m?.getBitmap(MediaMetadata.METADATA_KEY_ART) ?: m?.getBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART))
                  Hub.dur = m?.getLong(MediaMetadata.METADATA_KEY_DURATION) ?: 0L
                  Hub.playing = st?.state == PlaybackState.STATE_PLAYING
                  Hub.pos = st?.position ?: 0L
                  Hub.stamp = SystemClock.elapsedRealtime()
                  Hub.onChange?.invoke()
              }

              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  if (sbn.packageName == packageName) return
                  val n = sbn.notification
                  val a = n.actions?.firstOrNull { it.remoteInputs?.isNotEmpty() == true } ?: return
                  val title = n.extras.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: return
                  val text = n.extras.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: ""
                  Hub.chat = Hub.Msg(title, text, a, sbn.key)
                  Hub.onChange?.invoke()
              }
          }
          TOSEOF
          mkdir -p "$(dirname 'TOSIsland/app/src/main/java/com/tos/island/Prefs.kt')"
          cat > 'TOSIsland/app/src/main/java/com/tos/island/Prefs.kt' <<'TOSEOF'
          package com.tos.island

          import android.content.Context
          import android.content.SharedPreferences

          /** إعدادات الجزيرة: تُحفظ على الجهاز وتُطبَّق مباشرة. كل القيم بوحدة dp. */
          object Prefs {
              private var sp: SharedPreferences? = null

              fun init(c: Context) {
                  if (sp == null) sp = c.applicationContext.getSharedPreferences("tos_island", Context.MODE_PRIVATE)
              }

              private fun gi(k: String, def: Int): Int = sp?.getInt(k, def) ?: def
              private fun gb(k: String, def: Boolean): Boolean = sp?.getBoolean(k, def) ?: def
              private fun pi(k: String, v: Int) { sp?.edit()?.putInt(k, v)?.apply() }
              private fun pb(k: String, v: Boolean) { sp?.edit()?.putBoolean(k, v)?.apply() }

              /** عرض الكبسولة وهي ساكنة (حجم النوتش). */
              var idleW: Int
                  get() = gi("idleW", 124)
                  set(v) { pi("idleW", v) }
              /** ارتفاع الكبسولة. */
              var idleH: Int
                  get() = gi("idleH", 30)
                  set(v) { pi("idleH", v) }
              /** المسافة من أعلى الشاشة. */
              var top: Int
                  get() = gi("top", 4)
                  set(v) { pi("top", v) }
              /** إزاحة أفقية عن منتصف الشاشة. */
              var xoff: Int
                  get() = gi("xoff", 0)
                  set(v) { pi("xoff", v) }
              /** عرض المنطقة الفارغة في المنتصف (مكان الكاميرا). */
              var gap: Int
                  get() = gi("gap", 40)
                  set(v) { pi("gap", v) }
              /** عرض اللوحة الموسّعة. */
              var expW: Int
                  get() = gi("expW", 340)
                  set(v) { pi("expW", v) }
              /** استدارة زوايا اللوحة الموسّعة. */
              var radius: Int
                  get() = gi("radius", 26)
                  set(v) { pi("radius", v) }
              /** إبقاء الكبسولة ظاهرة دائمًا. */
              var always: Boolean
                  get() = gb("always", true)
                  set(v) { pb("always", v) }
              /** ألوان متحركة على الكبسولة وقت السكون. */
              /** رسالة تشخيص صغيرة عند لمس الجزيرة (للتأكد أن اللمس يصل). */
              var diag: Boolean
                  get() = gb("diag", true)
                  set(v) { pb("diag", v) }
              var idleAnim: Boolean
                  get() = gb("idleAnim", true)
                  set(v) { pb("idleAnim", v) }
              /** تشغيل تلقائي بعد إعادة تشغيل الهاتف. */
              var auto: Boolean
                  get() = gb("auto", true)
                  set(v) { pb("auto", v) }
              /** لون التمييز: 0 = تلقائي من غلاف الأغنية. */
              var accent: Int
                  get() = gi("accent", 0)
                  set(v) { pi("accent", v) }

              fun reset() { sp?.edit()?.clear()?.apply() }
          }
          TOSEOF
          P=TOSIsland/app/src/main/res/drawable-nodpi/ic_fg.png
          if [ ! -f "$P" ]; then
            mkdir -p "$(dirname "$P")"
            python3 -c "import zlib,struct;w=h=108;raw=b''.join(b'\\x00'+b'\\x00'*(w*4) for _ in range(h));c=lambda t,d:struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff);open('$P','wb').write(b'\\x89PNG\\r\\n\\x1a\\n'+c(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+c(b'IDAT',zlib.compress(raw))+c(b'IEND',b''))"
          fi
          find TOSIsland -type f | sort
          grep -n "versionName" TOSIsland/app/build.gradle.kts

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: TOSIsland
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          grep -E "^e: |What went wrong|error:" -A2 build.log | head -10 | while IFS= read -r l; do echo "::error::$l"; done
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: TOSIsland-debug
          path: TOSIsland/app/build/outputs/apk/debug/*.apk

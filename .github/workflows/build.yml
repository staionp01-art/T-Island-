          find TOSIsland -type f | sort
          grep -n "versionName" TOSIsland/app/build.gradle.kts
          ls TOSIsland/app/src/main/java/com/tos/island

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: TOSIsland
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          grep -E "^e: |What went wrong|error:" -A2 build.log | head -10 | while IFS= read -r l; do echo "::error::$l"; done
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: TOSIsland-debug
          path: TOSIsland/app/build/outputs/apk/debug/*.apk

                      msg(if (notifListenerOn()) "جارٍ التشغيل… ستظهر الجزيرة أعلى الشاشة." else "جارٍ التشغيل. لتظهر الموسيقى والرسائل فعّل «قراءة الإشعارات».", false)
                  } catch (t: Throwable) {
                      Hub.lastError = t.javaClass.simpleName + ": " + (t.message ?: "")
                  }
                  ui.postDelayed({ refresh() }, 800)
              }


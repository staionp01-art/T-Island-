name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare project
        run: |
          rm -rf TOSIsland
          mkdir -p "$(dirname 'TOSIsland/build.gradle.kts')"
          cat > 'TOSIsland/build.gradle.kts' <<'TOSEOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          TOSEOF
          mkdir -p "$(dirname 'TOSIsland/gradle.properties')"
          cat > 'TOSIsland/gradle.properties' <<'TOSEOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          TOSEOF
          mkdir -p "$(dirname 'TOSIsland/gradle/wrapper/gradle-wrapper.properties')"
          cat > 'TOSIsland/gradle/wrapper/gradle-wrapper.properties' <<'TOSEOF'
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
          TOSEOF
          mkdir -p "$(dirname 'TOSIsland/settings.gradle.kts')"
          cat > 'TOSIsland/settings.gradle.kts' <<'TOSEOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "TOSIsland"
          include(":app")
          TOSEOF
          mkdir -p "$(dirname 'TOSIsland/app/build.gradle.kts')"
          cat > 'TOSIsland/app/build.gradle.kts' <<'TOSEOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.tos.island"
              compileSdk = 35
              defaultConfig { applicationId = "com.tos.island"; minSdk = 26; targetSdk = 35; versionCode = 5; versionName = "3.2" }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          TOSEOF
          mkdir -p "$(dirname 'TOSIsland/app/src/main/AndroidManifest.xml')"
          cat > 'TOSIsland/app/src/main/AndroidManifest.xml' <<'TOSEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <application android:label="TOS Island" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".IslandService" android:exported="false" android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="overlay"/>
                  </service>
                  <service android:name=".NotifService" android:exported="true" android:label="TOS Island"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter><action android:name="android.service.notification.NotificationListenerService"/></intent-filter>
                  </service>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          TOSEOF
          mkdir -p "$(dirname 'TOSIsland/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml')"
          cat > 'TOSIsland/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml' <<'TOSEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          TOSEOF
          mkdir -p "$(dirname 'TOSIsland/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml')"
          cat > 'TOSIsland/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml' <<'TOSEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          TOSEOF
          mkdir -p "$(dirname 'TOSIsland/app/src/main/res/values/colors.xml')"
          cat > 'TOSIsland/app/src/main/res/values/colors.xml' <<'TOSEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_bg">#05091C</color>
          </resources>
          TOSEOF
          mkdir -p "$(dirname 'TOSIsland/app/src/main/java/com/tos/island/BootReceiver.kt')"
          cat > 'TOSIsland/app/src/main/java/com/tos/island/BootReceiver.kt' <<'TOSEOF'
          package com.tos.island

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.provider.Settings

          /** يعيد تشغيل الجزيرة بعد إقلاع الهاتف أو تحديث التطبيق (إن كان الخيار مفعّلًا). */
          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) {
                  Prefs.init(c)
                  if (!Prefs.auto) return
                  if (!Settings.canDrawOverlays(c)) return
                  try { c.startForegroundService(Intent(c, IslandService::class.java)) } catch (_: Throwable) {}
              }
          }
          TOSEOF
          mkdir -p "$(dirname 'TOSIsland/app/src/main/java/com/tos/island/ChatPanel.kt')"
          cat > 'TOSIsland/app/src/main/java/com/tos/island/ChatPanel.kt' <<'TOSEOF'
          package com.tos.island

          import android.content.Context
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.text.TextUtils
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.inputmethod.EditorInfo
          import android.view.inputmethod.InputMethodManager
          import android.widget.*

          /** لوحة الرد السريع: اسم المرسل + الرسالة + ردود جاهزة + حقل كتابة. */
          class ChatPanel(c: Context) : LinearLayout(c) {
              var onSend: ((String) -> Unit)? = null
              var onClose: (() -> Unit)? = null
              var onFocus: ((Boolean) -> Unit)? = null
              private val d = resources.displayMetrics.density
              private val name = TextView(c); private val msg = TextView(c); private val ed = EditText(c)
              private val topRow = LinearLayout(c); private val gapSp = View(c); private val sendBtn = TextView(c)

              private fun bg(col: Int, r: Float) = GradientDrawable().apply { setColor(col); cornerRadius = r * d; setStroke(maxOf(1, d.toInt()), 0x30A0B9FF) }

              init {
                  orientation = VERTICAL; layoutDirection = View.LAYOUT_DIRECTION_RTL
                  setBackgroundColor(Color.BLACK); setPadding((16 * d).toInt(), 0, (16 * d).toInt(), (12 * d).toInt())
                  // صف الترويسة: الاسم | فراغ للكاميرا | ✕  — لا شيء يُكتب في المنتصف
                  topRow.gravity = Gravity.CENTER_VERTICAL
                  name.setTextColor(Color.WHITE); name.textSize = 15f; name.setTypeface(null, android.graphics.Typeface.BOLD)
                  name.maxLines = 1; name.ellipsize = TextUtils.TruncateAt.END
                  topRow.addView(name, LayoutParams(0, LayoutParams.WRAP_CONTENT, 1f))
                  topRow.addView(gapSp, LayoutParams((Prefs.gap * d).toInt(), 1))
                  val x = TextView(c).apply { text = "✕"; setTextColor(Color.WHITE); textSize = 16f; gravity = Gravity.END or Gravity.CENTER_VERTICAL
                      setPadding((10 * d).toInt(), (10 * d).toInt(), (10 * d).toInt(), (10 * d).toInt()); setOnClickListener { onClose?.invoke() } }
                  topRow.addView(x, LayoutParams(0, LayoutParams.WRAP_CONTENT, 1f))
                  addView(topRow, LayoutParams(-1, ((Prefs.idleH + 4) * d).toInt()))
                  msg.setTextColor(0xCCFFFFFF.toInt()); msg.textSize = 13f; msg.maxLines = 3
                  addView(msg, LayoutParams(-1, 0, 1f))
                  val qr = LinearLayout(c)
                  listOf("تمام 👍", "أنا في الطريق", "بعدين أكلمك").forEach { t ->
                      qr.addView(TextView(c).apply { text = t; setTextColor(Color.WHITE); textSize = 12f; background = bg(0x22FFFFFF, 20f)
                          setPadding((12 * d).toInt(), (6 * d).toInt(), (12 * d).toInt(), (6 * d).toInt()); setOnClickListener { onSend?.invoke(t) } },
                          LayoutParams(-2, -2).apply { marginEnd = (6 * d).toInt() })
                  }
                  addView(qr, LayoutParams(-2, -2).apply { topMargin = (6 * d).toInt() })
                  val row = LinearLayout(c).apply { gravity = Gravity.CENTER_VERTICAL }
                  ed.hint = "اكتب ردك…"; ed.setTextColor(Color.WHITE); ed.setHintTextColor(0x88FFFFFF.toInt()); ed.textSize = 13f
                  ed.setSingleLine(); ed.imeOptions = EditorInfo.IME_ACTION_SEND; ed.background = bg(0x22FFFFFF, 22f)
                  ed.setPadding((14 * d).toInt(), (8 * d).toInt(), (14 * d).toInt(), (8 * d).toInt())
                  ed.setOnTouchListener { _, e ->
                      if (e.action == MotionEvent.ACTION_DOWN) { onFocus?.invoke(true)
                          ed.postDelayed({ ed.requestFocus(); (context.getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager).showSoftInput(ed, 0) }, 120) }
                      false }
                  ed.setOnEditorActionListener { _, _, _ -> send(); true }
                  row.addView(ed, LayoutParams(0, (40 * d).toInt(), 1f))
                  sendBtn.apply { text = "➤"; gravity = Gravity.CENTER; setTextColor(0xFF06202A.toInt()); textSize = 16f
                      background = bg(Hub.accentColor, 20f); setOnClickListener { send() } }
                  row.addView(sendBtn, LayoutParams((40 * d).toInt(), (40 * d).toInt()).apply { marginStart = (8 * d).toInt() })
                  addView(row, LayoutParams(-1, -2).apply { topMargin = (8 * d).toInt() })
              }

              private fun send() { val t = ed.text.toString().trim(); if (t.isNotEmpty()) onSend?.invoke(t) }
              fun bind(m: Hub.Msg) { name.text = m.sender; msg.text = m.text; ed.setText(""); sendBtn.background = bg(Hub.accentColor, 20f) }
              /** يضبط ارتفاع الترويسة وفراغ الكاميرا حسب الإعدادات. */
              fun relayout() {
                  (topRow.layoutParams as LayoutParams).height = ((Prefs.idleH + 4) * d).toInt()
                  (gapSp.layoutParams as LayoutParams).width = (Prefs.gap * d).toInt()
                  topRow.requestLayout()
              }
              fun sent() {
                  msg.text = "✓ تم الإرسال"; ed.setText("")
                  (context.getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager).hideSoftInputFromWindow(ed.windowToken, 0)
              }
          }
          TOSEOF
          mkdir -p "$(dirname 'TOSIsland/app/src/main/java/com/tos/island/GlowRing.kt')"
          cat > 'TOSIsland/app/src/main/java/com/tos/island/GlowRing.kt' <<'TOSEOF'
          package com.tos.island

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Matrix
          import android.graphics.Paint
          import android.graphics.RectF
          import android.graphics.SweepGradient
          import android.os.SystemClock
          import android.view.View
          import kotlin.math.max
          import kotlin.math.min

          /** إطار ألوان يدور حول الجزيرة كلها (يلمع أقوى عند اللمس). لا يعترض اللمس. */
          class GlowRing(c: Context) : View(c) {
              private val d = resources.displayMetrics.density
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE }
              private val rect = RectF()
              private val mtx = Matrix()
              private var sweep: SweepGradient? = null
              private var sw = 0
              private var sh = 0
              private var flashT = 0L
              /** يدور دائمًا (مثل وقت الموسيقى والرسائل) حتى لو أُطفئت حركة السكون. */
              var lively = false
              private val cols = intArrayOf(0xFF7FD6E4.toInt(), 0xFF8C86FF.toInt(), 0xFFFF7EB6.toInt(), 0xFFFFB26B.toInt(), 0xFF3DDC97.toInt(), 0xFF7FD6E4.toInt())

              fun flash() { flashT = SystemClock.uptimeMillis(); invalidate() }

              override fun onDraw(cv: Canvas) {
                  val w = width.toFloat(); val h = height.toFloat()
                  if (w < 2f || h < 2f) return
                  if (sweep == null || sw != width || sh != height) {
                      sweep = SweepGradient(w / 2f, h / 2f, cols, null); sw = width; sh = height
                  }
                  val now = SystemClock.uptimeMillis()
                  val boost = if (flashT == 0L) 0f else (1f - (now - flashT) / 650f).coerceIn(0f, 1f)
                  val moving = Prefs.idleAnim || lively || boost > 0f
                  mtx.setRotate(if (moving) (now / 11f) % 360f else 0f, w / 2f, h / 2f)
                  val sg = sweep
                  sg?.setLocalMatrix(mtx)
                  paint.shader = sg
                  val line = (2f + 2.5f * boost) * d
                  val r = max(1f, min(h / 2f, Prefs.radius * d) - line / 2f)
                  rect.set(line / 2f, line / 2f, w - line / 2f, h - line / 2f)
                  // توهج ناعم خلف الخط
                  paint.strokeWidth = line * 2.4f; paint.alpha = (55 + 90 * boost).toInt().coerceIn(0, 255)
                  cv.drawRoundRect(rect, r, r, paint)
                  paint.strokeWidth = line; paint.alpha = ((if (moving) 215 else 80) + 40 * boost).toInt().coerceIn(0, 255)
                  cv.drawRoundRect(rect, r, r, paint)
                  if (moving) postInvalidateOnAnimation()
              }
          }
          TOSEOF
          mkdir -p "$(dirname 'TOSIsland/app/src/main/java/com/tos/island/Hub.kt')"
          cat > 'TOSIsland/app/src/main/java/com/tos/island/Hub.kt' <<'TOSEOF'
          package com.tos.island

          import android.app.Notification
          import android.app.RemoteInput
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.media.session.MediaController
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock

          /** الحالة المشتركة بين خدمة الإشعارات وواجهة الجزيرة. */
          object Hub {
              class Msg(val sender: String, val text: String, val action: Notification.Action, val key: String)

              var title = ""; var artist = ""
              var cover: Bitmap? = null; var accent: Int = 0xFF7FD6E4.toInt()
              var playing = false; var pos = 0L; var dur = 0L; var stamp = 0L
              var controller: MediaController? = null
              var chat: Msg? = null
              val bands = FloatArray(8); @Volatile var live = false
              var onChange: (() -> Unit)? = null
              /** تُستدعى عند تغيير إعدادات الحجم/الموضع لتُطبَّق فورًا. */
              var onLayout: (() -> Unit)? = null
              var expandCb: (() -> Unit)? = null
              /** اللون المعروض: المختار من الإعدادات أو التلقائي من الغلاف. */
              val accentColor: Int get() = if (Prefs.accent != 0) Prefs.accent else accent
              /** حالة الخدمة + رسالة قصيرة تظهر في الكبسولة (للتأكد أن الجزيرة تعمل). */
              @Volatile var running = false
              var note: String? = null
              var lastError: String? = null

              fun updateCover(b: Bitmap?) {
                  cover = b
                  if (b != null) {
                      val px = Bitmap.createScaledBitmap(b, 1, 1, true).getPixel(0, 0)
                      val m = { v: Int -> (v * 0.7f + 76).toInt() }
                      accent = Color.rgb(m(Color.red(px)), m(Color.green(px)), m(Color.blue(px)))
                  } else accent = 0xFF7FD6E4.toInt()
              }

              /** رد حقيقي على إشعار الرسالة عبر RemoteInput. */
              fun reply(ctx: Context, text: String) {
                  val a = chat?.action ?: return
                  val ris = a.remoteInputs ?: return
                  val i = Intent(); val b = Bundle()
                  ris.forEach { b.putCharSequence(it.resultKey, text) }
                  RemoteInput.addResultsToIntent(ris, i, b)
                  try { a.actionIntent.send(ctx, 0, i) } catch (_: Exception) {}
              }

              /** أغنية تجريبية لمعاينة اللوحة الموسّعة (تختفي بعد 15 ثانية). */
              fun demoMusic() {
                  title = "أغنية تجريبية"; artist = "TOS Island"; playing = true
                  dur = 200000L; pos = 62000L; stamp = SystemClock.elapsedRealtime()
                  onChange?.invoke()
                  expandCb?.invoke()
                  Handler(Looper.getMainLooper()).postDelayed({
                      if (title == "أغنية تجريبية") { title = ""; artist = ""; playing = false; onChange?.invoke() }
                  }, 15000)
              }
          }
          TOSEOF
          mkdir -p "$(dirname 'TOSIsland/app/src/main/java/com/tos/island/IslandService.kt')"
          cat > 'TOSIsland/app/src/main/java/com/tos/island/IslandService.kt' <<'TOSEOF'
          package com.tos.island

          import android.Manifest
          import android.app.*
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.graphics.PixelFormat
          import android.media.audiofx.Visualizer
          import android.os.Build
          import android.os.IBinder
          import android.view.Gravity
          import android.view.WindowManager
          import kotlin.math.hypot
          import kotlin.math.pow

          class IslandService : Service() {
              private lateinit var wm: WindowManager
              private lateinit var view: IslandView
              private var viz: Visualizer? = null
              private lateinit var lp: WindowManager.LayoutParams

              override fun onBind(i: Intent?): IBinder? = null
              override fun onStartCommand(i: Intent?, f: Int, id: Int) = START_STICKY

              override fun onCreate() {
                  super.onCreate()
                  Hub.lastError = null
                  try {
                      Prefs.init(this)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(NotificationChannel("island", "Island", NotificationManager.IMPORTANCE_MIN))
                      val n = Notification.Builder(this, "island").setContentTitle("TOS Island").setContentText("الجزيرة تعمل").setSmallIcon(android.R.drawable.ic_media_play).build()
                      if (Build.VERSION.SDK_INT >= 34) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE) else startForeground(1, n)
                      wm = getSystemService(WINDOW_SERVICE) as WindowManager
                      view = IslandView(this)
                      val nf = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                      lp = WindowManager.LayoutParams(-2, -2, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          nf or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS, PixelFormat.TRANSLUCENT)
                      lp.gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      lp.x = (Prefs.xoff * resources.displayMetrics.density).toInt()
                      lp.y = (Prefs.top * resources.displayMetrics.density).toInt()
                      // السماح بالرسم داخل منطقة الكاميرا (الثقب) في أعلى الشاشة
                      if (Build.VERSION.SDK_INT >= 30) lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                      else if (Build.VERSION.SDK_INT >= 28) lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                      view.focusCb = { need -> lp.flags = if (need) lp.flags and nf.inv() else lp.flags or nf; wm.updateViewLayout(view, lp) }
                      wm.addView(view, lp)
                      Hub.onLayout = { applyLayout() }
                      Hub.running = true
                      Hub.note = "TOS 3.2 ✓"
                      Hub.onChange?.invoke()
                      startViz()
                  } catch (t: Throwable) {
                      Hub.running = false
                      Hub.lastError = t.javaClass.simpleName + ": " + (t.message ?: "")
                      stopSelf()
                  }
              }

              /** يطبّق موضع الجزيرة وحجمها بعد تغيير الإعدادات. */
              private fun applyLayout() {
                  val dd = resources.displayMetrics.density
                  lp.x = (Prefs.xoff * dd).toInt()
                  lp.y = (Prefs.top * dd).toInt()
                  try { wm.updateViewLayout(view, lp) } catch (_: Throwable) {}
                  view.relayout()
              }

              private fun startViz() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) return
                  try {
                      viz = Visualizer(0).apply {
                          enabled = false
                          captureSize = Visualizer.getCaptureSizeRange()[1]
                          setDataCaptureListener(object : Visualizer.OnDataCaptureListener {
                              override fun onWaveFormDataCapture(v: Visualizer?, w: ByteArray?, r: Int) {}
                              override fun onFftDataCapture(v: Visualizer?, f: ByteArray?, r: Int) {
                                  if (f == null) return
                                  for (k in 0..7) {
                                      var s = 0f
                                      for (i in 1 + k * 3..3 + k * 3) s += hypot(f[2 * i].toFloat(), f[2 * i + 1].toFloat())
                                      Hub.bands[k] = (s / 3f / 90f).coerceIn(0f, 1f).pow(2.2f)
                                  }
                                  Hub.live = true
                              }
                          }, Visualizer.getMaxCaptureRate() / 2, false, true)
                          enabled = true
                      }
                  } catch (_: Throwable) {}
              }

              override fun onDestroy() {
                  Hub.running = false
                  Hub.onChange = null
                  Hub.onLayout = null
                  Hub.expandCb = null
                  try { viz?.release() } catch (_: Throwable) {}
                  try { wm.removeView(view) } catch (_: Throwable) {}
                  super.onDestroy()
              }
          }
          TOSEOF
          mkdir -p "$(dirname 'TOSIsland/app/src/main/java/com/tos/island/IslandView.kt')"
          cat > 'TOSIsland/app/src/main/java/com/tos/island/IslandView.kt' <<'TOSEOF'
          package com.tos.island

          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.Color
          import android.graphics.Outline
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.Looper
          import android.view.View
          import android.view.ViewOutlineProvider
          import android.view.animation.OvershootInterpolator
          import android.widget.FrameLayout
          import kotlin.math.max
          import kotlin.math.min

          /** الجزيرة: كبسولة ساكنة ثابتة ← كبسولة نشطة ← موسيقى موسّعة ← رسالة مع رد. المنتصف محجوز للكاميرا. */
          class IslandView(c: Context) : FrameLayout(c) {
              enum class S { HIDDEN, IDLE, PILL, MUSIC, CHAT }
              var state = S.HIDDEN
              var focusCb: ((Boolean) -> Unit)? = null
              private val d = resources.displayMetrics.density
              private val box = FrameLayout(c)
              private val music = MusicView(c)
              private val chat = ChatPanel(c)
              private val h = Handler(Looper.getMainLooper())
              private val ringBg = GradientDrawable().apply { setColor(Color.TRANSPARENT); setStroke(max(1, d.toInt()), 0x40A0B9FF) }
              private val ring = GlowRing(c)
              private var noteActive = false
              private var demoShown = false
              private var cw = 0; private var chh = 0; private var shownKey = ""

              init {
                  addView(box, LayoutParams(0, 0))
                  box.addView(music, LayoutParams(-1, -1)); box.addView(chat, LayoutParams(-1, -1))
                  box.addView(ring, LayoutParams(-1, -1))
                  box.setBackgroundColor(Color.BLACK); box.clipToOutline = true
                  box.outlineProvider = object : ViewOutlineProvider() {
                      override fun getOutline(v: View, o: Outline) { o.setRoundRect(0, 0, v.width, v.height, min(v.height / 2f, Prefs.radius * d)) } }
                  box.visibility = GONE; chat.visibility = GONE
                  music.onExpand = { set(S.MUSIC) }; music.onCollapse = { set(rest()) }
                  music.onPress = { ring.flash(); box.animate().scaleX(0.94f).scaleY(0.94f).setDuration(90).start() }
                  music.onRelease = { box.animate().scaleX(1f).scaleY(1f).setDuration(240).setInterpolator(OvershootInterpolator(2.2f)).start() }
                  chat.onSend = { t -> Hub.reply(context, t); chat.sent(); h.postDelayed({ Hub.chat = null; set(rest()) }, 1400) }
                  chat.onClose = { Hub.chat = null; set(rest()) }
                  chat.onFocus = { focusCb?.invoke(it) }
                  Hub.onChange = { h.post { update() } }
                  Hub.expandCb = { h.post { demoShown = true; if (Hub.title.isNotEmpty()) set(S.MUSIC) } }
                  h.post { set(rest()) }
              }

              private fun rest(): S =
                  if (Hub.title.isNotEmpty() && Hub.playing) S.PILL else if (Prefs.always) S.IDLE else S.HIDDEN

              private fun update() {
                  val m = Hub.chat
                  if (Hub.note != null && !noteActive && m == null) {
                      noteActive = true; set(S.PILL)
                      h.postDelayed({ Hub.note = null; noteActive = false; set(rest()); music.invalidate() }, 3200)
                  }
                  if (m != null && m.key != shownKey) {
                      shownKey = m.key; chat.bind(m); set(S.CHAT)
                      h.postDelayed({ if (state == S.CHAT && Hub.chat?.key == shownKey) { Hub.chat = null; set(rest()) } }, 9000)
                  } else if ((state == S.HIDDEN || state == S.IDLE) && Hub.title.isNotEmpty() && Hub.playing) set(S.PILL)
                  else if (state == S.PILL && Hub.note == null && (Hub.title.isEmpty() || !Hub.playing)) set(rest())
                  else if (state == S.MUSIC && demoShown && Hub.title.isEmpty()) { demoShown = false; set(rest()) }
                  music.invalidate()
              }

              /** يعيد حساب الحجم فورًا (عند تحريك الإعدادات). */
              fun relayout() {
                  val s = if (state == S.IDLE && !Prefs.always) S.HIDDEN else if (state == S.HIDDEN && Prefs.always) S.IDLE else state
                  set(s, true)
              }

              fun set(s: S, force: Boolean = false) {
                  if (!force && s == state && (box.visibility == VISIBLE) == (s != S.HIDDEN)) return
                  state = s
                  val dm = resources.displayMetrics
                  val idleW = (Prefs.idleW * d).toInt(); val idleH = (Prefs.idleH * d).toInt()
                  val gap = (Prefs.gap * d).toInt()
                  val band = idleH + (4 * d).toInt()
                  val maxW = min(dm.widthPixels - (16 * d).toInt(), (Prefs.expW * d).toInt())
                  val zone = ((if (Hub.note != null) 96 else 64) * d).toInt()
                  val pillW = min(maxW, max(idleW + (36 * d).toInt(), gap + 2 * zone))
                  val (tw, th) = when (s) {
                      S.HIDDEN -> 0 to 0
                      S.IDLE -> idleW to idleH
                      S.PILL -> pillW to idleH
                      S.MUSIC -> maxW to (band + (172 * d).toInt())
                      S.CHAT -> maxW to (band + (200 * d).toInt())
                  }
                  music.expanded = s == S.MUSIC
                  ring.lively = s != S.IDLE
                  music.idle = s == S.IDLE
                  music.visibility = if (s == S.CHAT) GONE else VISIBLE
                  chat.visibility = if (s == S.CHAT) VISIBLE else GONE
                  chat.relayout()
                  if (s != S.CHAT) focusCb?.invoke(false)
                  if (s != S.HIDDEN) box.visibility = VISIBLE
                  if (force) {
                      val lp0 = box.layoutParams
                      lp0.width = tw; lp0.height = th
                      ringBg.cornerRadius = min(th / 2f, Prefs.radius * d)
                      box.layoutParams = lp0; box.invalidateOutline()
                      cw = tw; chh = th
                      if (s == S.HIDDEN) box.visibility = GONE
                      music.invalidate()
                      return
                  }
                  val w0 = if (cw == 0) (tw * 0.6f).toInt() else cw; val h0 = if (chh == 0) (th * 0.6f).toInt() else chh
                  ValueAnimator.ofFloat(0f, 1f).apply {
                      duration = 420; interpolator = OvershootInterpolator(1.1f)
                      addUpdateListener {
                          val f = it.animatedValue as Float
                          val lp = box.layoutParams
                          lp.width = max(0, (w0 + (tw - w0) * f).toInt()); lp.height = max(0, (h0 + (th - h0) * f).toInt())
                          ringBg.cornerRadius = min(lp.height / 2f, Prefs.radius * d); box.layoutParams = lp; box.invalidateOutline()
                      }
                      addListener(object : android.animation.AnimatorListenerAdapter() {
                          override fun onAnimationEnd(a: android.animation.Animator) { cw = tw; chh = th; if (s == S.HIDDEN) box.visibility = GONE }
                      })
                      start()
                  }
                  music.invalidate()
              }
          }
          TOSEOF
          mkdir -p "$(dirname 'TOSIsland/app/src/main/java/com/tos/island/MainActivity.kt')"

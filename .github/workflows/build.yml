              private fun batteryOk(): Boolean =
                  try { getSystemService(PowerManager::class.java).isIgnoringBatteryOptimizations(packageName) } catch (_: Throwable) { false }

              private fun startIsland() {
                  if (!Settings.canDrawOverlays(this)) { msg("فعّل «العرض فوق التطبيقات» من الخطوة 1 أولًا.", true); return }
                  Hub.lastError = null

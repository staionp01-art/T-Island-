          /** خلفية TOS: كحلي عميق + توهّج سماوي (أعلى) وبنفسجي (أسفل)، نفس شاشة الإطلاق في TOS v3. */
          class Backdrop(c: Context) : View(c) {
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              override fun onDraw(cv: Canvas) {
                  val w = width.toFloat(); val h = height.toFloat()
                  cv.drawColor(0xFF070B14.toInt())
                  val r = 340f * resources.displayMetrics.density
                  p.shader = RadialGradient(0f, 0f, r, 0x617FD6E4, 0x007FD6E4, Shader.TileMode.CLAMP)
                  cv.drawCircle(0f, 0f, r, p)
                  p.shader = RadialGradient(w, h, r, 0x668C86FF, 0x008C86FF, Shader.TileMode.CLAMP)
                  cv.drawCircle(w, h, r, p)
              }
          }

          /** شعار TOS الصغير: حلقة سماوية + نقطة. */
          class Mark(c: Context) : View(c) {
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              override fun onDraw(cv: Canvas) {
                  val s = width.toFloat(); val u = s / 32f
                  p.style = Paint.Style.STROKE; p.strokeWidth = 5 * u; p.color = 0xFF7FD6E4.toInt(); p.alpha = 178
                  cv.drawCircle(s / 2, s / 2, 11 * u, p)
                  p.style = Paint.Style.FILL; p.alpha = 255
                  cv.drawCircle(s / 2, s / 2, 3 * u, p)
              }
          }

          class MainActivity : Activity() {
              private val bgc = 0xFF070B14.toInt()
              private val panel = 0xF70D1024.toInt()
              private val ink = 0xFFEAF2FF.toInt()
              private val mute = 0xFFB8C6DE.toInt()
              private val cyan = 0xFF7FD6E4.toInt()
              private val dark = 0xFF06202A.toInt()
              private val okc = 0xFF3DDC97.toInt()
              private val badc = 0xFFFF6B7A.toInt()
              private val line = 0x40A0B9FF

              private class Row(val badge: TextView, val num: String, val act: TextView, val ok: () -> Boolean)

              private var d = 1f
              private val rows = ArrayList<Row>()
              private val refreshers = ArrayList<() -> Unit>()
              private val ui = Handler(Looper.getMainLooper())
              private lateinit var svcDot: View
              private lateinit var svc: TextView
              private lateinit var info: TextView
              private lateinit var permTitle: TextView
              private lateinit var startBtn: TextView

              private fun dp(v: Int) = (v * d).toInt()

              private fun glass(fill: Int, r: Int, stroke: Int = 0): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(fill); g.cornerRadius = r * d
                  if (stroke != 0) g.setStroke(maxOf(1, d.toInt()), stroke)
                  return g
              }

              private fun oval(col: Int, ring: Boolean = false): GradientDrawable {
                  val g = GradientDrawable()
                  g.setShape(GradientDrawable.OVAL); g.setColor(col)
                  if (ring) g.setStroke(dp(3), Color.WHITE)
                  return g
              }

              private fun txt(t: String, size: Float, color: Int, bold: Boolean = false): TextView {
                  val v = TextView(this)
                  v.text = t; v.textSize = size; v.setTextColor(color)
                  if (bold) v.typeface = Typeface.DEFAULT_BOLD
                  return v
              }

              private fun top(m: Int) = LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(m) }

              private fun styleBtn(v: TextView, primary: Boolean) {
                  v.textSize = if (primary) 16f else 14f
                  v.setTextColor(if (primary) dark else ink)
                  v.background = if (primary) glass(cyan, 99) else glass(0x14FFFFFF, 99, 0x33FFFFFF)
              }

              private fun button(t: String, primary: Boolean, onClick: () -> Unit): TextView {
                  val v = txt(t, 14f, ink, true)
                  v.gravity = Gravity.CENTER
                  styleBtn(v, primary)
                  v.setOnClickListener { onClick() }
                  v.setOnTouchListener { x, e ->
                      if (e.action == MotionEvent.ACTION_DOWN) x.alpha = 0.7f
                      else if (e.action == MotionEvent.ACTION_UP || e.action == MotionEvent.ACTION_CANCEL) x.alpha = 1f
                      false
                  }
                  return v
              }

              private fun card(): LinearLayout {
                  val c = LinearLayout(this)
                  c.orientation = LinearLayout.VERTICAL
                  c.background = glass(panel, 26, line)
                  c.setPadding(dp(18), dp(16), dp(18), dp(16))
                  return c
              }

              private fun stepHead(num: String, title: String): TextView {
                  val v = txt("$num  ·  $title", 15f, ink, true)
                  return v
              }

              private fun addStep(card: LinearLayout, num: String, label: String, hint: String, ok: () -> Boolean, go: () -> Unit) {
                  val r = LinearLayout(this)
                  r.gravity = Gravity.CENTER_VERTICAL
                  r.setPadding(0, dp(8), 0, dp(8))
                  r.setOnClickListener { go() }
                  val badge = txt(num, 13f, ink, true)
                  badge.gravity = Gravity.CENTER
                  r.addView(badge, LinearLayout.LayoutParams(dp(30), dp(30)))
                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.addView(txt(label, 14f, ink, true))
                  col.addView(txt(hint, 11f, mute), top(2))
                  r.addView(col, LinearLayout.LayoutParams(0, -2, 1f).apply { marginStart = dp(12) })
                  val act = txt("تفعيل", 12f, dark, true)
                  act.gravity = Gravity.CENTER
                  act.setPadding(dp(14), dp(7), dp(14), dp(7))
                  act.background = glass(cyan, 99)
                  r.addView(act)
                  card.addView(r, top(8))
                  rows.add(Row(badge, num, act, ok))
              }

              private fun slider(card: LinearLayout, label: String, lo: Int, hi: Int, get: () -> Int, put: (Int) -> Unit) {
                  val head = LinearLayout(this)
                  head.gravity = Gravity.CENTER_VERTICAL
                  head.addView(txt(label, 13f, ink), LinearLayout.LayoutParams(0, -2, 1f))
                  val vt = txt("", 12f, cyan, true)
                  head.addView(vt)
                  card.addView(head, top(16))
                  val sb = SeekBar(this)
                  sb.max = hi - lo
                  sb.progressTintList = ColorStateList.valueOf(cyan)
                  sb.thumbTintList = ColorStateList.valueOf(cyan)
                  sb.progressBackgroundTintList = ColorStateList.valueOf(0x33FFFFFF)
                  card.addView(sb, top(2))
                  val show: () -> Unit = {
                      vt.text = "${get()} dp"
                      sb.progress = get() - lo
                  }
                  show()
                  sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, user: Boolean) {
                          if (!user) return
                          put(p + lo)
                          vt.text = "${p + lo} dp"
                          Hub.onLayout?.invoke()
                      }
                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) {}
                  })
                  refreshers.add(show)
              }

              private fun toggle(card: LinearLayout, label: String, hint: String, get: () -> Boolean, put: (Boolean) -> Unit) {
                  val r = LinearLayout(this)
                  r.gravity = Gravity.CENTER_VERTICAL
                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.addView(txt(label, 14f, ink, true))
                  col.addView(txt(hint, 11f, mute), top(2))
                  r.addView(col, LinearLayout.LayoutParams(0, -2, 1f))
                  val chip = txt("", 12f, dark, true)
                  chip.gravity = Gravity.CENTER
                  chip.setPadding(dp(14), dp(7), dp(14), dp(7))
                  val show: () -> Unit = {
                      val on = get()
                      chip.text = if (on) "مفعّل" else "متوقف"
                      chip.setTextColor(if (on) dark else ink)
                      chip.background = if (on) glass(cyan, 99) else glass(0x14FFFFFF, 99, 0x33FFFFFF)
                  }
                  show()
                  chip.setOnClickListener {
                      put(!get())
                      show()
                      Hub.onLayout?.invoke()
                      Hub.onChange?.invoke()
                  }
                  r.addView(chip)
                  card.addView(r, top(16))
                  refreshers.add(show)
              }

              private fun accents(card: LinearLayout) {
                  card.addView(txt("لون التمييز", 13f, ink), top(18))
                  val row = LinearLayout(this)
                  row.gravity = Gravity.CENTER_VERTICAL
                  val cols = intArrayOf(0xFF7FD6E4.toInt(), 0xFF8C86FF.toInt(), 0xFFFF7EB6.toInt(), 0xFF3DDC97.toInt(), 0xFFFFB26B.toInt())
                  val auto = txt("تلقائي", 12f, ink, true)
                  auto.gravity = Gravity.CENTER
                  auto.setPadding(dp(14), dp(7), dp(14), dp(7))
                  row.addView(auto, LinearLayout.LayoutParams(-2, -2).apply { marginEnd = dp(10) })
                  val dots = ArrayList<View>()
                  for (c in cols) {
                      val v = View(this)
                      dots.add(v)
                      row.addView(v, LinearLayout.LayoutParams(dp(32), dp(32)).apply { marginEnd = dp(10) })
                  }
                  val show: () -> Unit = {
                      val a = Prefs.accent
                      auto.background = if (a == 0) glass(cyan, 99) else glass(0x14FFFFFF, 99, 0x33FFFFFF)
                      auto.setTextColor(if (a == 0) dark else ink)
                      for (i in cols.indices) dots[i].background = oval(cols[i], a == cols[i])
                  }
                  show()
                  auto.setOnClickListener { Prefs.accent = 0; show(); Hub.onChange?.invoke() }
                  for (i in cols.indices) dots[i].setOnClickListener { Prefs.accent = cols[i]; show(); Hub.onChange?.invoke() }
                  card.addView(row, top(10))
                  refreshers.add(show)
              }

              private fun msg(t: String, bad: Boolean) {
                  info.text = t
                  info.setTextColor(if (bad) badc else mute)
              }

              private fun notifListenerOn() =
